workflows:
  android-native:
    name: Build Aura Defense Android APK
    max_build_duration: 90
    instance_type: mac_mini_m1
    working_directory: .
    environment:
      node: 20
      java: 17
    scripts:
      - name: Build all in one step
        script: |
          corepack disable
          rm -f package-lock.json yarn.lock .yarnrc
          rm -rf node_modules artifacts/mobile/node_modules
          pnpm install --no-frozen-lockfile
          cd artifacts/mobile && npx expo export --platform android --output-dir dist
          npx expo prebuild --platform android --clean
          cd android
          ./gradlew assembleRelease
    artifacts:
      - '**/*.apk'
