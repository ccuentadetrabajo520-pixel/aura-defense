workflows:
  android-native:
    name: Build Aura Defense Android APK
    max_build_duration: 90
    instance_type: mac_mini_m1
    working_directory: .
    environment:
      node: 20
      java: 17
    scripts:
      - name: Build all in one step
        script: |
          # Instala pnpm globalmente en la máquina de Codemagic
          npm install -g pnpm
          # Limpia archivos de bloqueo antiguos
          rm -f package-lock.json yarn.lock
          rm -rf node_modules artifacts/mobile/node_modules
          # Instala dependencias con pnpm
          pnpm install
          # Entra a la carpeta de la app
          cd artifacts/mobile
          # Genera el proyecto nativo
          npx expo prebuild --platform android --clean
          # Compila el APK
          cd android
          ./gradlew assembleRelease
    artifacts:
      - artifacts/mobile/android/app/build/outputs/apk/release/*.apk
