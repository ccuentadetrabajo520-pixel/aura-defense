workflows:
  android-native:
    name: Build Aura Defense Android APK
    max_build_duration: 90
    instance_type: mac_mini_m1
    working_directory: .
    environment:
      node: 20
      java: 17
    scripts:
      - name: Build all in one step
        script: |
          # Cleanup any lock files that confuse npm
          rm -f package-lock.json
          rm -f yarn.lock
          # Install dependencies using pnpm from root
          pnpm install
          # Navigate to app folder
          cd artifacts/mobile
          # Generate native project
          npx expo prebuild --platform android --clean
          # Navigate to android and build
          cd android
          ./gradlew assembleRelease
    artifacts:
      - artifacts/mobile/android/app/build/outputs/apk/release/*.apk
