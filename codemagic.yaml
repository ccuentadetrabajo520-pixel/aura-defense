workflows:
  android-apk:
    name: Compilar APK Android
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 20
      java: 17
      vars:
        NODE_OPTIONS: "--max-old-space-size=8192"
        CI: "1"
    scripts:
      - name: Instalar dependencias del proyecto
        script: |
          echo "node-linker=hoisted" > .npmrc
          echo "shamefully-hoist=true" >> .npmrc
          rm -rf android
          npx pnpm@9 install --no-frozen-lockfile
      - name: Vincular punto de entrada
        script: |
          node -e '
          const fs = require("fs");
          const hasRootApp = ["App.js", "App.tsx", "App.jsx", "App.ts"].some(f => fs.existsSync(f));
          if (!hasRootApp) {
            const candidates = [
              "src/App.tsx", "src/App.js", "src/App.jsx",
              "src/app.tsx", "src/app.js",
              "app/index.tsx", "app/index.js",
              "src/index.tsx", "src/index.js"
            ];
            const target = candidates.find(f => fs.existsSync(f));
            if (target) {
              const cleanPath = "./" + target.replace(/\\/g, "/").replace(/\.(tsx|jsx|js|ts)$/, "");
              fs.writeFileSync("App.js", `import App from "${cleanPath}";\nexport default App;\n`);
            }
          }
          '
      - name: Generar carpeta Android nativa
        script: |
          npx expo prebuild --platform android --no-install
      - name: Generar APK Release
        script: |
          cd android
          chmod +x gradlew
          export NODE_OPTIONS="--max-old-space-size=8192"
          ./gradlew assembleRelease -x lint --no-daemon
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
