workflows:
  android-native:
    name: Build Aura Defense Android APK
    max_build_duration: 90
    instance_type: mac_mini_m1
    working_directory: .
    environment:
      node: 20
      java: 17
    scripts:
      - name: Build all in one step
        script: |
          npm install -g pnpm --force
          rm -f package-lock.json yarn.lock .npmrc
          rm -rf node_modules artifacts/mobile/node_modules
          pnpm install
          cd artifacts/mobile
          rm -rf .expo dist
          NODE_OPTIONS=--max-old-space-size=4096 npx expo export --platform android --output-dir dist --no-minify
          npx expo prebuild --platform android --clean
          cd android
          ./gradlew assembleRelease
    artifacts:
      - '**/*.apk'
