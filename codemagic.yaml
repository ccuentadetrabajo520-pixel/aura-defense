workflows:
  android-apk:
    name: Compilar APK Android
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 20
      java: 17
      vars:
        NODE_OPTIONS: "--max-old-space-size=8192"
        CI: "1"
    scripts:
      - name: Configurar entorno e instalar dependencias
        script: |
          echo "node-linker=hoisted" > .npmrc
          echo "shamefully-hoist=true" >> .npmrc
          rm -rf node_modules android
          npx pnpm@9 install --no-frozen-lockfile
      - name: Preparar punto de entrada
        script: |
          node -e '
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const hasAppFolder = fs.existsSync("app");
          const hasRouterPkg = pkg.dependencies && pkg.dependencies["expo-router"];

          if (hasAppFolder || hasRouterPkg) {
            console.log("-> Configurando Expo Router");
            pkg.main = "expo-router/entry";
          } else {
            console.log("-> Configurando Expo Estándar");
            pkg.main = "node_modules/expo/AppEntry.js";

            const rootAppExists = ["App.js", "App.tsx", "App.jsx", "App.ts"].some(f => fs.existsSync(f));
            if (!rootAppExists) {
              const candidates = [
                "app.tsx", "app.js", "app.jsx",
                "src/App.tsx", "src/App.js", "src/App.jsx", "src/App.ts",
                "src/app.tsx", "src/app.js",
                "src/index.tsx", "src/index.js",
                "index.tsx", "index.js",
                "src/main.tsx", "src/main.js"
              ];
              const target = candidates.find(f => fs.existsSync(f));
              if (target) {
                console.log("-> Archivo principal encontrado en:", target);
                const cleanPath = "./" + target.replace(/\\/g, "/").replace(/\.(tsx|jsx|js|ts)$/, "");
                fs.writeFileSync("App.js", `import App from "${cleanPath}";\nexport default App;\n`);
              } else {
                console.log("-> Creando App.js base...");
                fs.writeFileSync("App.js", `import React from "react"; import { View, Text } from "react-native"; export default function App() { return <View><Text>App</Text></View>; }`);
              }
            }
          }
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
      - name: Generar carpeta Android nativa
        script: |
          npx expo prebuild --platform android --no-install
      - name: Generar APK Release
        script: |
          cd android
          chmod +x gradlew
          export NODE_OPTIONS="--max-old-space-size=8192"
          ./gradlew assembleRelease -x lint --no-daemon
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
