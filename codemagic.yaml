workflows:
  android-native:
    name: Build Aura Defense Android APK
    max_build_duration: 90
    instance_type: mac_mini_m1
    working_directory: .
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install workspace dependencies
        script: |
          corepack enable
          yarn install --immutable
      - name: Prepare Android native project
        script: |
          cd artifacts/mobile
            export JAVA_HOME=$JAVA_HOME
                     export ANDROID_HOME=$ANDROID_SDK_ROOT
                       export PATH=$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH
                         npx expo prebuild --platform android --clean
                           cd android
                             ./gradlew assembleRelease
      - name: Build Release APK
        script: |
          export JAVA_HOME=$CM_JAVA_HOME
          export ANDROID_HOME=$CM_ANDROID_SDK_ROOT
          export PATH=$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH
          cd artifacts/mobile
          ./android/gradlew :app:assembleRelease -x lint --no-daemon
    artifacts:
      - artifacts/mobile/android/app/build/outputs/apk/release/*.apk