workflows:
  android-native:
    name: Build Aura Defense Android APK
    max_build_duration: 90
    instance_type: mac_mini_m1
    working_directory: .
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Build Android APK
        script: |
          cd artifacts/mobile
          pnpm exec expo prebuild --platform android --no-install --clean
          cd android
          ./gradlew assembleRelease -x lint --no-daemon
    artifacts:
      - artifacts/mobile/android/app/build/outputs/apk/release/*.apk
