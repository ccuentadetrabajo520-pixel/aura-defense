workflows:
  android-native:
    name: Build Aura Defense Android APK
    max_build_duration: 90
    instance_type: mac_mini_m1
    working_directory: .
    environment:
      node: 20
      java: 17
    scripts:
      - name: Build all in one step
        script: |
          pnpm install --frozen-lockfile
          cd artifacts/mobile
          npx expo prebuild --platform android --clean
          cd android
          ./gradlew assembleRelease --stacktrace --info
    artifacts:
      - '**/*.apk'
