workflows:
  android-native:
    name: Build Aura Defense Android APK
    max_build_duration: 90
    instance_type: mac_mini_m1
    working_directory: .
    environment:
      node: 20
      java: 17
    scripts:
      - name: Build all in one step
        script: |
          set -e
          npm install -g pnpm --force
          # Limpiamos todo rastro de la instalación anterior
          rm -f package-lock.json yarn.lock
          rm -rf node_modules artifacts/mobile/node_modules
          # FORZAMOS la instalación plana (esto elimina el error de .pnpm)
          pnpm install --config.node-linker=hoisted --config.public-hoist-pattern[]=*
          cd artifacts/mobile
          rm -rf .expo dist
          npx expo export --platform android --output-dir dist
