workflows:
  android-apk:
    name: Compilar APK Android
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 20
      java: 17
      vars:
        NODE_OPTIONS: "--max-old-space-size=4096"
        CI: "1"
    scripts:
      - name: Configurar e instalar dependencias
        script: |
          echo "node-linker=hoisted" > .npmrc
          echo "shamefully-hoist=true" >> .npmrc
          rm -rf node_modules
          npx pnpm@9 install --no-frozen-lockfile
      - name: Vincular punto de entrada App
        script: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          const rootApps = ["App.tsx", "App.js", "App.jsx", "App.ts"];
          if (rootApps.some(f => fs.existsSync(f))) {
            console.log("El archivo App principal ya existe en la raíz.");
            process.exit(0);
          }

          let mainFile = null;
          if (fs.existsSync("package.json")) {
            try {
              const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
              if (pkg.main && !pkg.main.includes("node_modules")) mainFile = pkg.main;
            } catch (e) {}
          }

          const candidates = [
            mainFile,
            "app.tsx", "app.js", "app.jsx",
            "src/App.tsx", "src/App.js", "src/App.jsx", "src/App.ts",
            "src/app.tsx", "src/app.js",
            "src/index.tsx", "src/index.js",
            "index.tsx", "index.js",
            "app/index.tsx", "app/index.js"
          ].filter(Boolean);

          let target = candidates.find(f => fs.existsSync(f));

          if (target) {
            console.log("Archivo principal ubicado en:", target);
            const cleanPath = "./" + target.replace(/\\/g, "/").replace(/\.(tsx|jsx|js|ts)$/, "");
            fs.writeFileSync("App.js", `import App from "${cleanPath}";\nexport default App;\n`);
            console.log("App.js creado correctamente en la raíz.");
          } else {
            console.log("Generando archivo de entrada en raíz...");
            fs.writeFileSync("App.js", `import { View, Text } from "react-native";\nexport default function App() { return <View><Text>App</Text></View>; }\n`);
          }
          '
      - name: Generar carpeta Android
        script: |
          npx expo prebuild --platform android --no-install
      - name: Generar APK Release
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -x lint
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
