workflows:
  android-native:
    name: Build Aura Defense Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20
      java: 17
    scripts:
      - name: Build Debug APK
        script: |
          export JAVA_HOME=$CM_JAVA_HOME
          export ANDROID_HOME=$CM_ANDROID_SDK_ROOT
          export PATH=$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH
          cd artifacts/android-native
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x bootstrap-gradle.sh
          ./bootstrap-gradle.sh assembleDebug
    artifacts:
      - artifacts/android-native/app/build/outputs/apk/debug/*.apk